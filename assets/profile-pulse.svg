<svg width="920" height="360" viewBox="0 0 920 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ansh Parmar project constellation</title>
  <desc id="desc">A balanced animated profile graphic showing Ansh Parmar's portfolio, AI, machine learning, vision, and data projects.</desc>
  <style>
    .headline { font: 800 30px Arial, Helvetica, sans-serif; fill: #f0f6fc; text-anchor: middle; }
    .subtitle { font: 600 14px Arial, Helvetica, sans-serif; fill: #8b949e; text-anchor: middle; }
    .hub-name { font: 800 20px Arial, Helvetica, sans-serif; fill: #f0f6fc; text-anchor: middle; }
    .hub-note { font: 700 12px Arial, Helvetica, sans-serif; fill: #8b949e; text-anchor: middle; }
    .repo { font: 800 15px Arial, Helvetica, sans-serif; fill: #f0f6fc; }
    .note { font: 600 12px Arial, Helvetica, sans-serif; fill: #8b949e; }
    .chip { font: 700 12px Arial, Helvetica, sans-serif; fill: #dbeafe; text-anchor: middle; }
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.4; }
    .ring { stroke: #30363d; stroke-width: 1.2; stroke-dasharray: 8 10; animation: spin 20s linear infinite; transform-origin: 460px 190px; }
    .link { stroke: url(#linkGradient); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 12 14; animation: flow 2.8s linear infinite; opacity: .85; }
    .node-dot { filter: url(#glow); animation: breathe 2.4s ease-in-out infinite; }
    .node-dot:nth-of-type(2) { animation-delay: .2s; }
    .node-dot:nth-of-type(3) { animation-delay: .4s; }
    .node-dot:nth-of-type(4) { animation-delay: .6s; }
    .node-dot:nth-of-type(5) { animation-delay: .8s; }
    .node-dot:nth-of-type(6) { animation-delay: 1s; }
    @keyframes flow {
      from { stroke-dashoffset: 52; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: .72; r: 7; }
      50% { opacity: 1; r: 10; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <defs>
    <linearGradient id="panelGradient" x1="0" x2="920" y1="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117" />
      <stop offset=".5" stop-color="#101827" />
      <stop offset="1" stop-color="#061320" />
    </linearGradient>
    <linearGradient id="hubGradient" x1="386" x2="534" y1="116" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39d353" />
      <stop offset=".5" stop-color="#2f81f7" />
      <stop offset="1" stop-color="#ff7b72" />
    </linearGradient>
    <linearGradient id="linkGradient" x1="170" x2="750" y1="122" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39d353" />
      <stop offset=".5" stop-color="#2f81f7" />
      <stop offset="1" stop-color="#ff00ff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="918" height="358" rx="22" fill="url(#panelGradient)" stroke="#30363d" stroke-width="2" />

  <text x="460" y="46" class="headline">Ansh Parmar</text>
  <text x="460" y="72" class="subtitle">Full-stack developer turning AI/ML ideas into polished products</text>

  <line x1="394" y1="154" x2="300" y2="120" class="link" />
  <line x1="384" y1="190" x2="300" y2="190" class="link" />
  <line x1="394" y1="226" x2="300" y2="260" class="link" />
  <line x1="526" y1="154" x2="620" y2="120" class="link" />
  <line x1="536" y1="190" x2="620" y2="190" class="link" />
  <line x1="526" y1="226" x2="620" y2="260" class="link" />

  <circle cx="460" cy="190" r="92" class="ring" fill="none" />
  <circle cx="460" cy="190" r="60" class="ring" fill="none" opacity=".65" />
  <circle cx="460" cy="190" r="48" fill="#0d1117" stroke="url(#hubGradient)" stroke-width="4" />
  <text x="460" y="184" class="hub-name">Ansh</text>
  <text x="460" y="205" class="hub-note">AI + Web</text>

  <rect x="76" y="96" width="224" height="48" rx="12" class="card" />
  <circle cx="300" cy="120" r="7" fill="#2f81f7" class="node-dot" />
  <text x="98" y="119" class="repo">Portfolio</text>
  <text x="98" y="136" class="note">TypeScript website</text>

  <rect x="76" y="166" width="224" height="48" rx="12" class="card" />
  <circle cx="300" cy="190" r="7" fill="#39d353" class="node-dot" />
  <text x="98" y="189" class="repo">CascadeSignal</text>
  <text x="98" y="206" class="note">DeFi risk signals</text>

  <rect x="76" y="236" width="224" height="48" rx="12" class="card" />
  <circle cx="300" cy="260" r="7" fill="#7ee787" class="node-dot" />
  <text x="98" y="259" class="repo">AnomalyBoost</text>
  <text x="98" y="276" class="note">Fraud detection ML</text>

  <rect x="620" y="96" width="224" height="48" rx="12" class="card" />
  <circle cx="620" cy="120" r="7" fill="#f2cc60" class="node-dot" />
  <text x="642" y="119" class="repo">FocusGuard</text>
  <text x="642" y="136" class="note">AI phone detector</text>

  <rect x="620" y="166" width="224" height="48" rx="12" class="card" />
  <circle cx="620" cy="190" r="7" fill="#ff7b72" class="node-dot" />
  <text x="642" y="189" class="repo">RepForge</text>
  <text x="642" y="206" class="note">Vision fitness app</text>

  <rect x="620" y="236" width="224" height="48" rx="12" class="card" />
  <circle cx="620" cy="260" r="7" fill="#ff00ff" class="node-dot" />
  <text x="642" y="259" class="repo">Insight-X</text>
  <text x="642" y="276" class="note">Complaint intelligence</text>

  <rect x="236" y="308" width="106" height="28" rx="14" fill="#13233a" stroke="#2f81f7" />
  <text x="289" y="327" class="chip">TypeScript</text>
  <rect x="356" y="308" width="88" height="28" rx="14" fill="#10281d" stroke="#39d353" />
  <text x="400" y="327" class="chip">Python</text>
  <rect x="458" y="308" width="104" height="28" rx="14" fill="#2d210b" stroke="#f2cc60" />
  <text x="510" y="327" class="chip">Notebooks</text>
  <rect x="576" y="308" width="86" height="28" rx="14" fill="#2d160d" stroke="#ff7b72" />
  <text x="619" y="327" class="chip">Astro</text>
</svg>
